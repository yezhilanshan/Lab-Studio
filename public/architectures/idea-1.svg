" font-weight="600">Point Encoder + TCN</text><text x="632.5" y="487" text-anchor="middle" fill="#4b5b6b" opacity=".82" font-size="15">独立时序分支</text></g><g data-node="tokens"><title>模态感知 Token; 时间编码 + 模态编码</title><rect x="795" y="320" width="215" height="100" rx="12" fill="#e6ece4" stroke="#6f8f7e" stroke-width="1.5"/><text x="902.5" y="356" text-anchor="middle" fill="#2c5447" font-size="19" font-weight="600">模态感知 Token</text><text x="902.5" y="382" text-anchor="middle" fill="#2c5447" opacity=".82" font-size="15">时间编码 + 模态编码</text></g><g data-node="query"><title>Event Query Decoder; 事件查询 + 迭代细化</title><rect x="1070" y="320" width="275" height="100" rx="12" fill="#e6ece4" stroke="#6f8f7e" stroke-width="1.5"/><text x="1207.5" y="356" text-anchor="middle" fill="#2c5447" font-size="19" font-weight="600">Event Query Decoder</text><text x="1207.5" y="382" text-anchor="middle" fill="#2c5447" opacity=".82" font-size="15">事件查询 + 迭代细化</text></g><g data-node="boundary"><title>边界深监督; 逐层事件存在 / 起止</title><rect x="1070" y="180" width="275" height="80" rx="12" fill="#eef0eb" stroke="#b7c0c7" stroke-width="1.5"/><text x="1207.5" y="216" text-anchor="middle" fill="#4b5b6b" font-size="19" font-weight="600">边界深监督</text><text x="1207.5" y="242" text-anchor="middle" fill="#4b5b6b" opacity=".82" font-size="15">逐层事件存在 / 起止</text></g><g data-node="event"><title>有序事件 Token; 剔除空查询 · 按时间排序</title><rect x="1070" y="600" width="275" height="100" rx="12" fill="#e6ece4" stroke="#6f8f7e" stroke-width="1.5"/><text x="1207.5" y="636" text-anchor="middle" fill="#2c5447" font-size="19" font-weight="600">有序事件 Token</text><text x="1207.5" y="662" text-anchor="middle" fill="#2c5447" opacity=".82" font-size="15">剔除空查询 · 按时间排序</text></g><g data-node="proj"><title>Event Projector; 雷达 → 语言维度</title><rect x="795" y="600" width="215" height="100" rx="12" fill="#eceff2" stroke="#8fa0ae" stroke-width="1.5"/><text x="902.5" y="636" text-anchor="middle" fill="#4b5b6b" font-size="19" font-weight="600">Event Projector
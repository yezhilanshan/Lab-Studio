<title id="title">想法1：双分支编码 → Event Query → 指令条件语言理解整体架构</title><desc id="desc">运动频谱与三维结构并行编码，事件查询负责聚合与时间定位。。RD/点云分支与事件查询为原稿架构；不能由后续单模态实验推定本图已整体实现。；若用于在线处理，需单独核验 TCN、查询范围与未来信息泄漏。</desc><defs><marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a8f82" stroke-width="1.3"/></marker><marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#87663a" stroke-width="1.3"/></marker><marker id="train" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#4b5b6b" stroke-width="1.3"/></marker></defs>

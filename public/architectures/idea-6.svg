ize="19" font-weight="600">Semantic Evidence</text><text x="665.0" y="502" text-anchor="middle" fill="#6e532e" opacity=".82" font-size="15">语义变化 + 可靠性</text></g><g data-node="lif"><title>LIF Event Controller; 泄漏 · 阈值 · 不应期</title><rect x="840" y="440" width="235" height="100" rx="12" fill="#f3ead9" stroke="#b39a6c" stroke-width="1.5"/><text x="957.5" y="476" text-anchor="middle" fill="#6e532e" font-size="19" font-weight="600">LIF Event Controller</text><text x="957.5" y="502" text-anchor="middle" fill="#6e532e" opacity=".82" font-size="15">泄漏 · 阈值 · 不应期</text></g><g data-node="buffer"><title>短时特征缓存; 保留待回溯证据</title><rect x="840" y="200" width="235" height="100" rx="12" fill="#eceff2" stroke="#8fa0ae" stroke-width="1.5"/><text x="957.5" y="236" text-anchor="middle" fill="#3d443a" font-size="19" font-weight="600">短时特征缓存</text><text x="957.5" y="262" text-anchor="middle" fill="#3d443a" opacity=".82" font-size="15">保留待回溯证据</text></g><g data-node="refine"><title>回溯边界定位; 发火 ≠ 边界 / 定稿旧状态 / 重建新状态</title><rect x="1135" y="320" width="255" height="110" rx="12" fill="#e6ece4" stroke="#6f8f7e" stroke-width="1.5"/><text x="1262.5" y="350" text-anchor="middle" fill="#2c5447" font-size="19" font-weight="600">回溯边界定位</text><text x="1262.5" y="376" text-anchor="middle" fill="#2c5447" opacity=".82" font-size="15">发火 ≠ 边界</text><text x="1262.5" y="398" text-anchor="middle" fill="#2c5447" opacity=".82" font-size="15">定稿旧状态 / 重建新状态</text></g><g data-node="token"><title>Global-Detail Tokenizer; 全局语义 + 局部运动细节</title><rect x="1135" y="620" width="255" height="100" rx="12" fill="#e6ece4" stroke="#6f8f7e" stroke-width="1.5"/><text x="1262.5" y="656" text-anchor="middle" fill="#2c5447" font-size="17" font-weight="600">Global-Detail Tokenizer</text><text x="1262.5" y="682" text-anchor="middle" fill="#2c5447" opacity=".82" font-size="15">全局语义 + 局部运动细节</text></g><g data-node="mem"><title>分层事件记忆; L0 / L1 / L2</title><rect x="840" y="620" width="235" height="100" rx="12" fill="#eceff2" stroke="#8fa0
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-labelledby="title desc">
<title id="title">想法5：Latent Memory：持续写入，查询内反复检索与演化整体架构</title><desc id="desc">三尺度外部记忆不按动作边界切分；固定描述任务在每次查询内部进行多轮演化。。三组访问范围：Short→S，Mid→S∪M，Long→S∪M∪L；容量、迭代轮数及编码器细节待定。；反馈仅表示一次查询内的 Evolved LMT 重新检索；跨查询周期是否继承 LMT 状态尚未确认。</desc><defs><marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a8f82" stroke-width="1.3"/></marker><marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#87663a" stroke-width="1.3"/></marker><marker id="train" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#4b5b6b" stroke-width="1.3"/></marker></defs>

<rect width="1440" height="900" fill="#fcfaf5"/><text x="48" y="50" font-size="12" fill="#666c60" letter-spacing="2">SEER / IDEA 5 / ARCHITECTURE</text>
<text x="48" y="88" font-size="29" fill="#20241e" font-weight="600">Latent Memory：持续写入，查询内反复检索与演化</text><text x="48" y="112" font-size="15" fill="#666c60">三尺度外部记忆不按动作边界切分；固定描述任务在每次查询内部进行多轮演化。</text>
<line x1="48" y1="132" x2="84" y2="132" stroke="#8a8f82" stroke-width="2" /><text x="94" y="137" class="label">数据与表示</text><line x1="255" y1="132" x2="291" y2="132" stroke="#87663a" stroke-width="2" stroke-dasharray="7 5"/><text x="301" y="137" class="label">状态 / 控制反馈</text><line x1="510" y1="132" x2="546" y2="132" stroke="#4b5b6b" stroke-width="2" stroke-dasharray="7 5"/><text x="556" y="137" class="label">训练 / 评价辅助</text><rect x="535" y="425" width="845" height="310" rx="18" fill="#f8f6ef" stroke="#ded8cb"/><text x="555" y="452" class="group">HME / 单次查询内部的迭代环</text><polyline points="230,285 280,285" fill="none" stroke="#8a8f82" stroke-width="2" marker-end="url(#data)" stroke-linejoin="round"/><polyline points="495,285 555,285" fill="none" stroke="#8a8f82" stroke-width="2" marker-end="url(#data)" stroke-linejoin="round"/><polyline points="230,565 280,565" fill="none" stroke="#8a8f82" stroke-width="2" marker-end="url(#data)" stroke-linejoin="round"/><polyline points="495,565 565,565" fill="none" stroke="#8a8f82" stroke-width="2" marker-end="url(#data)" stroke-linejoin="round"/><polyline points="678,370 678,490" fill="none" stroke="#8a8f82" stroke-width="2" marker-end="url(#data)" stroke-linejoin="round"/><polyline points="790,545 840,545" fill="none" stroke="#8a8f82" stroke-width="2" marker-end="url(#data)" stroke-linejoin="round"/><polyline points="1065,545 1115,545" fill="none" stroke="#8a8f82" stroke-width="2" marker-end="url(#data)" stroke-linejoin="round"/><polyline points="1228,490 1228,395 952,395 952,335" fill="none" stroke="#8a8f82" stroke-width="2" marker-end="url(#data)" stroke-linejoin="round"/><polyline points="1065,280 1115,280" fill="none" stroke="#8a8f82" stroke-width="2" marker-end="url(#data)" stroke-linejoin="round"/><polyline points="600,370 600,400 388,400 388,510" fill="none" stroke="#8a8f82" stroke-width="2" marker-end="url(#data)" stroke-linejoin="round"/><polyline points="1228,600 1228,675 678,675 678,600" fill="none" stroke="#87663a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#control)" stroke-linejoin="round"/><g data-node="input"><title>连续毫米波流; 不显式切动作段</title><rect x="45" y="235" width="185" height="100" rx="12" fill="#f0ede5" stroke="#8a8f84" stroke-width="1.5"/><text x="137.5" y="271" text-anchor="middle" fill="#3d443a" font-size="19" font-weight="600">连续毫米波流</text><text x="137.5" y="297" text-anchor="middle" fill="#3d443a" opacity=".82" font-size="15">不显式切动作段</text></g><g data-node="enc"><title>Radar Encoder; 连续时序特征</title><rect x="280" y="235" width="215" height="100" rx="12" fill="#eceff2" stroke="#8fa0ae" stroke-width="1.5"/><text x="387.5" y="271" text-anchor="middle" fill="#4b5b6b" font-size="19" font-weight="600">Radar Encoder</text><text x="387.5" y="297" text-anchor="middle" fill="#4b5b6b" opacity=".82" font-size="15">连续时序特征</text></g><g data-node="mem"><title>三尺度外部记忆; Short：近期细节 / Mid：中期历史 / Long：长期证据</title><rect x="555" y="200" width="245" height="170" rx="12" fill="#eceff2" stroke="#8fa0ae" stroke-width="1.5"/><text x="677.5" y="230" text-anchor="middle" fill="#3d443a" font-size="19" font-weight="600">三尺度外部记忆</text><text x="677.5" y="256" text-anchor="middle" fill="#3d443a" opacity=".82" font-size="15">Short：近期细节</text><text x="677.5" y="278" text-anchor="middle" fill="#3d443a" opacity=".82" font-size="15">Mid：中期历史</text><text x="677.5" y="300" text-anchor="middle" fill="#3d443a" opacity=".82" font-size="15">Long：长期证据</text></g><g data-node="q"><title>固定描述指令; + 初始三组 LMT / 定期查询时触发</title><rect x="45" y="510" width="185" height="110" rx="12" fill="#f0ede5" stroke="#8a8f84" stroke-width="1.5"/><text x="137.5" y="540" text-anchor="middle" fill="#3d443a" font-size="19" font-weight="600">固定描述指令</text><text x="137.5" y="566" text-anchor="middle" fill="#3d443a" opacity=".82" font-size="15">+ 初始三组 LMT</text><text x="137.5" y="588" text-anchor="middle" fill="#3d443a" opacity=".82" font-size="15">定期查询时触发</text></g><g data-node="boot"><title>Bootstrap Forward; 冻结 LLM 前向 / 取 LMT 隐藏状态</title><rect x="280" y="510" width="215" height="110" rx="12" fill="#2c5447" stroke="#2c5447" stroke-width="1.5"/><text x="387.5" y="540" text-anchor="middle" fill="#fcfaf5" font-size="19" font-weight="600">Bootstrap Forward</text><text x="387.5" y="566" text-anchor="middle" fill="#fcfaf5" opacity=".82" font-size="15">冻结 LLM 前向</text><text x="387.5" y="588" text-anchor="middle" fill="#fcfaf5" opacity=".82" font-size="15">取 LMT 隐藏状态</text></g><g data-node="retr"><title>LMT 引导分层检索; 按组限定可见记忆 / 相关历史证据</title><rect x="565" y="490" width="225" height="110" rx="12" fill="#eceff2" stroke="#8fa0ae" stroke-width="1.5"/><text x="677.5" y="520" text-anchor="middle" fill="#3d443a" font-size="19" font-weight="600">LMT 引导分层检索</text><text x="677.5" y="546" text-anchor="middle" fill="#3d443a" opacity=".82" font-size="15">按组限定可见记忆</text><text x="677.5" y="568" text-anchor="middle" fill="#3d443a" opacity=".82" font-size="15">相关历史证据</text></g><g data-node="inject"><title>按组注入证据; 三组 LMT 上下文</title><rect x="840" y="490" width="225" height="110" rx="12" fill="#e6ece4" stroke="#6f8f7e" stroke-width="1.5"/><text x="952.5" y="526" text-anchor="middle" fill="#2c5447" font-size="19" font-weight="600">按组注入证据</text><text x="952.5" y="552" text-anchor="middle" fill="#2c5447" opacity=".82" font-size="15">三组 LMT 上下文</text></g><g data-node="update"><title>冻结 LLM 更新; Evolved LMT</title><rect x="1115" y="490" width="225" height="110" rx="12" fill="#2c5447" stroke="#2c5447" stroke-width="1.5"/><text x="1227.5" y="526" text-anchor="middle" fill="#fcfaf5" font-size="19" font-weight="600">冻结 LLM 更新</text><text x="1227.5" y="552" text-anchor="middle" fill="#fcfaf5" opacity=".82" font-size="15">Evolved LMT</text></g><g data-node="out"><title>LLM 生成描述; 截至当前的有序行为</title><rect x="1115" y="225" width="225" height="110" rx="12" fill="#e6ece4" stroke="#6f8f7e" stroke-width="1.5"/><text x="1227.5" y="261" text-anchor="middle" fill="#3f6b58" font-size="19" font-weight="600">LLM 生成描述</text><text x="1227.5" y="287" text-anchor="middle" fill="#3f6b58" opacity=".82" font-size="15">截至当前的有序行为</text></g><g data-node="evolved"><title>最终 Evolved LMT; 本次查询的潜在证据</title><rect x="840" y="225" width="225" height="110" rx="12" fill="#e6ece4" stroke="#6f8f7e" stroke-width="1.5"/><text x="952.5" y="261" text-anchor="middle" fill="#2c5447" font-size="19" font-weight="600">最终 Evolved LMT</text><text x="952.5" y="287" text-anchor="middle" fill="#2c5447" opacity=".82" font-size="15">本次查询的潜在证据</text></g><g><rect x="389.0" y="374" width="102" height="24" rx="5" fill="#fcfaf5"/><text x="440" y="391" text-anchor="middle" class="label" fill="#8a8f82">按组读取记忆</text></g><g><rect x="824.0" y="650" width="256" height="24" rx="5" fill="#fcfaf5"/><text x="952" y="667" text-anchor="middle" class="label" fill="#87663a">下一轮：更新后的 LMT 重新检索</text></g><rect x="42" y="770" width="1356" height="105" rx="12" fill="#f0ede5"/><text x="62" y="799" font-size="15" font-weight="600" fill="#4e6055">图示边界 · v1.0 总体方案；G0 未通过，G2 未启动</text><text x="62" y="825" font-size="15" fill="#666c60">三组访问范围：Short→S，Mid→S∪M，Long→S∪M∪L；容量、迭代轮数及编码器细节待定。</text><text x="62" y="849" font-size="15" fill="#666c60">反馈仅表示一次查询内的 Evolved LMT 重新检索；跨查询周期是否继承 LMT 状态尚未确认。</text></svg>
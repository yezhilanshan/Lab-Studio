eight="600">Novelty → 电流</text><text x="930.0" y="287" text-anchor="middle" fill="#6e532e" opacity=".82" font-size="15">I = ReLU(n − b)</text></g><g data-node="lif"><title>LIF 膜电位 V; 泄漏 · 阈值 · Fire</title><rect x="1095" y="225" width="235" height="100" rx="12" fill="#f3ead9" stroke="#b39a6c" stroke-width="1.5"/><text x="1212.5" y="261" text-anchor="middle" fill="#6e532e" font-size="19" font-weight="600">LIF 膜电位 V</text><text x="1212.5" y="287" text-anchor="middle" fill="#6e532e" opacity=".82" font-size="15">泄漏 · 阈值 · Fire</text></g><g data-node="m"><title>内容累积 M / A; 保存当前事件内容</title><rect x="545" y="455" width="220" height="100" rx="12" fill="#eceff2" stroke="#8fa0ae" stroke-width="1.5"/><text x="655.0" y="491" text-anchor="middle" fill="#3d443a" font-size="19" font-weight="600">内容累积 M / A</text><text x="655.0" y="517" text-anchor="middle" fill="#3d443a" opacity=".82" font-size="15">保存当前事件内容</text></g><g data-node="z"><title>事件 Token Z; Fire 时定稿旧事件</title><rect x="820" y="455" width="220" height="100" rx="12" fill="#e6ece4" stroke="#6f8f7e" stroke-width="1.5"/><text x="930.0" y="491" text-anchor="middle" fill="#2c5447" font-size="19" font-weight="600">事件 Token Z</text><text x="930.0" y="517" text-anchor="middle" fill="#2c5447" opacity=".82" font-size="15">Fire 时定稿旧事件</text></g><g data-node="reset"><title>重置 / 自适应阈值; 当前观测初始化新状态</title><rect x="1095" y="455" width="235" height="100" rx="12" fill="#f3ead9" stroke="#b39a6c" stroke-width="1.5"/><text x="1212.5" y="491" text-anchor="middle" fill="#6e532e" font-size="19" font-weight="600">重置 / 自适应阈值</text><text x="1212.5" y="517" text-anchor="middle" fill="#6e532e" opacity=".82" font-size="15">当前观测初始化新状态</text></g><g data-node="proj"><title>Projector; 事件 → 语言表示</title><rect x="545" y="635" width="220" height="90" rx="12" fill="#eceff2" stroke="#8fa0ae" stroke-width="1.5"/><text x="655.0" y="671" text-anchor="middle" fill="#4b5b6b" font-size="19" font-weight="600">Projector</text><text x="655.0" y="697" text-anchor="middle" fill="#4b5b6b" opacity=".82" font-size="15">事件 → 语言表示</text></g><g data-node="llm"><title>LLM; 按序读取事件 Token</title><rect x="820" y="635" width="220" height="90" rx="12" fill="#2c5447" stroke="#2c5447" stroke-width="1.5"/><text x="930.0" y="671" text-anchor="middle" fill="#fcfaf5" font-size="19" font-weight="600">LLM</text><text x="930.0" y="697" text-anchor="middle" fill="#fcfaf5" opacity=".82" font-size="15">按序读取事件 Token</text></g><g data-node="out"><title>连续行为描述; 有序语言输出</title><rect x="1095" y="635" width="235" height="90" rx="12" fill="#e6ece4" stroke="#6f8f7e" stroke-width="1.5"/><text x="1212.5" y="671" text-anchor="middle" fill="#3f6b58" font-size="19" font-weight="600">连续行为描述</text><text x="1212.5" y="697" text-anchor="middle" fill="#3f6b58" opacity=".82" font-size="15">有序语言输出</text></g><g><rect x="585.0" y="136" width="130" height="24" rx="5" fill="#fcfaf5"/><text x="650" y="153" text-anchor="middle" class="label" fill="#8a8f82">当前特征 F_t</text></g><g><rect x="987.0" y="363" width="116" height="24" rx="5" fill="#fcfaf5"/><text x="1045" y="380" text-anchor="middle" class="label" fill="#87663a">Fire：定稿</text></g><g><rect x="591.0" y="571" width="368" height="24" rx="5" fill="#fcfaf5"/><text x="775" y="588" text-anchor="middle" class="label" fill="#87663a">Keep 更新 / Fire 重置 C 与 M/A</text></g><rect x="42" y="770" width="1356" height="105" rx="12" fill="#f0ede5"/><text x="62" y="799" font-size="15" font-weight="600" fill="#4e6055">图示边界 · 原始机制方案；不直接继承 SAEF 实验</text><text x="62" y="825" font-size="15" fill="#666c60">C 是语义比较状态；M/A 是内容累积器；膜电位 V 只累计变化证据。</text><text x="62" y="849" font-size="15" fill="#666c60">Keep 持续更新状态；Fire 输出旧事件并重置。原稿中的阈值、训练与归属仍须固定协议验证。</text></svg>
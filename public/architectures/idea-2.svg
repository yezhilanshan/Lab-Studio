<title id="title">想法2：Semantic-LIF：变化检测与事件内容分开维护整体架构</title><desc id="desc">新颖度超过基线才形成输入电流；Fire 定稿旧 Token，并以当前观测初始化新状态。。C 是语义比较状态；M/A 是内容累积器；膜电位 V 只累计变化证据。；Keep 持续更新状态；Fire 输出旧事件并重置。原稿中的阈值、训练与归属仍须固定协议验证。</desc><defs><marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a8f82" stroke-width="1.3"/></marker><marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#87663a" stroke-width="1.3"/></marker><marker id="train" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#4b5b6b" stroke-width="1.3"/></marker></defs>
